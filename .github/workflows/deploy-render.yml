name: Deploy licence server (Render)

# Render's free web service is the quickest no-VPS option: it sleeps after
# 15 minutes of inactivity, and the keep-alive workflow wakes it every
# 10 minutes so the app never meets a cold start.
#
# If you would rather have a server that never sleeps, use deploy-worker.yml
# (Cloudflare Workers) instead — it is always on and free.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server/**
      - '*.zip'
      - .github/workflows/deploy-render.yml

permissions:
  contents: read

concurrency:
  group: dolomite-render-deploy
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  deploy:
    name: Push to Render and wait for the health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare the server project
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [ -f server/package.json ]; then
            echo "server/ is already extracted — nothing to do."
            exit 0
          fi
          tmp="$(mktemp -d)"
          for zip in Dolomite-monorepo.zip dolomite-dashboard.zip; do
            [ -f "$zip" ] || continue
            rm -rf "$tmp" && mkdir -p "$tmp"
            echo "looking for the server inside $zip"
            unzip -q "$zip" -d "$tmp" || continue
            found="$(find "$tmp" -maxdepth 4 -name server.js -type f -print -quit)"
            if [ -n "$found" ]; then
              srcdir="$(dirname "$found")"
              mkdir -p server
              cp -R "$srcdir"/. server/
              rm -rf "$tmp"
              echo "::notice::extracted server/ from $zip"
              exit 0
            fi
          done
          echo "::error::No server project found."
          echo "::error::Expected server/package.json, or one of: Dolomite-monorepo.zip, dolomite-dashboard.zip"
          echo "--- repository root ---"
          ls -la
          exit 1

      - name: Verify the project layout
        shell: bash
        run: |
          set -uo pipefail
          missing=0
          for path in package.json server.js lib public render.yaml; do
            if [ ! -e "$path" ]; then
              echo "::error::missing $path"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::The server is not inside server/. Expected layout:"
            echo "  server/package.json"
            echo "  server/server.js"
            echo "  server/lib/"
            echo "  server/public/"
            echo "  server/render.yaml"
            echo "--- repository root ---"
            ls -la
            exit 1
          fi
          echo "layout ok"

      - name: Run the protocol test
        run: npm test

      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set — nothing to trigger."
            echo "In Render: Service -> Settings -> Deploys -> Deploy Hook."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "deploy hook triggered"

      - name: Wait for the service to answer
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_URL:-}" ]; then
            echo "RENDER_URL repository variable is not set — skipping the health check."
            exit 0
          fi
          for attempt in $(seq 1 20); do
            if curl -fsS "${RENDER_URL}/health" > /dev/null 2>&1; then
              echo "service is up after ${attempt} attempt(s)"
              curl -fsS "${RENDER_URL}/health"
              exit 0
            fi
            echo "waiting… (${attempt}/20)"
            sleep 10
          done
          echo "service did not come up in time"
          exit 1

      - name: Write job summary
        run: |
          {
            echo "## Render deploy"
            echo
            echo "- Service: \`${{ vars.RENDER_URL }}\`"
            echo "- Dashboard: \`${{ vars.RENDER_URL }}/dashboard\`"
          } >> "$GITHUB_STEP_SUMMARY"
